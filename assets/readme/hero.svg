<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="edge-bench — a benchmark harness for edge ML. Measured MobileNetV2 INT8 latency over 100 runs: Coral Edge TPU 5.07 ms at 197 inferences per second, Raspberry Pi 4 CPU 33.24 ms, workstation x86 CPU 0.99 ms.">
  <title>edge-bench</title>

  <defs>
    <linearGradient id="fast" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/><stop offset="1" stop-color="#2ea043"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#388bfd"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" rx="16" fill="#0b0f16"/>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="16" fill="none" stroke="#232c39"/>

  <!-- wordmark -->
  <rect x="64" y="52" width="12" height="12" rx="3" fill="#58a6ff"/>
  <text x="92" y="66" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace"
        font-size="38" font-weight="700" fill="#e3e9f2" letter-spacing="-0.5">edge-bench</text>

  <text x="64" y="118" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="26" fill="#8b98ac">Benchmarks ML models on real edge hardware — and verifies</text>
  <text x="64" y="152" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="26" fill="#8b98ac">they still compute the same answer on every device.</text>

  <!-- measurement ruler: recurring motif -->
  <line x1="64" y1="196" x2="1136" y2="196" stroke="#232c39"/>
  <g fill="#2b3644">
    <rect x="64" y="190" width="2" height="7"/><rect x="332" y="192" width="2" height="5"/>
    <rect x="600" y="190" width="2" height="7"/><rect x="868" y="192" width="2" height="5"/>
    <rect x="1134" y="190" width="2" height="7"/>
  </g>
  <text x="64" y="228" font-family="ui-monospace, 'SF Mono', Menlo, monospace"
        font-size="20" fill="#5d6b80" letter-spacing="1.4">MOBILENETV2 INT8 · 100 RUNS · SEED 42</text>

  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
    <text x="64" y="288" font-size="26" fill="#e3e9f2">Coral Edge TPU</text>
    <rect x="404" y="268" width="86" height="26" rx="5" fill="url(#fast)"/>
    <text x="508" y="288" font-size="27" font-weight="700" fill="#3fb950">5.07 ms</text>

    <text x="64" y="342" font-size="26" fill="#e3e9f2">Raspberry Pi 4 CPU</text>
    <rect x="404" y="322" width="564" height="26" rx="5" fill="url(#mid)"/>
    <text x="986" y="342" font-size="27" font-weight="700" fill="#58a6ff">33.24 ms</text>
  </g>

  <text x="720" y="288" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="22" fill="#5d6b80">197 inferences/s</text>
</svg>
