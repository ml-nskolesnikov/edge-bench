name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  POETRY_VERSION: "2.2.1"

jobs:
  # ---------------------------------------------------------------------
  # CPU-only quality gate. Must stay free of GPU, Edge TPU, model weights
  # and datasets so it runs on any hosted runner.
  # ---------------------------------------------------------------------
  quality:
    name: Lint, types and tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('poetry.lock') }}
          restore-keys: venv-${{ runner.os }}-py3.12-

      - name: Install dependencies
        run: make install

      # Each step maps 1:1 onto a Make target, so `make ci` locally and CI
      # here run exactly the same commands. Steps are split only to get
      # separate red/green markers in the UI.
      - name: Lint (ruff check)
        run: make lint

      - name: Format check (ruff format)
        run: make format-check

      - name: Type check (mypy)
        run: make typecheck

      - name: Tests with coverage
        run: make test-cov

      - name: Build / import smoke
        # Catches import-time breakage that only shows up at container start.
        run: make build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  # ---------------------------------------------------------------------
  # Container build + runtime healthcheck.
  # ---------------------------------------------------------------------
  docker:
    name: Docker build and smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: edge-bench:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container starts and reports healthy
        run: |
          docker run -d --name edge-bench-ci -p 18000:8000 edge-bench:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18000/api/health; then
              echo "health check passed"
              exit 0
            fi
            sleep 2
          done
          echo "container failed to become healthy; logs:"
          docker logs edge-bench-ci
          exit 1

      - name: Clean up
        if: always()
        run: docker rm -f edge-bench-ci || true

  # ---------------------------------------------------------------------
  # Dependency advisories. Reported, not enforced: an advisory in a
  # transitive dependency should not block an unrelated merge. Failures are
  # visible as a yellow job rather than hidden behind `|| true`.
  # ---------------------------------------------------------------------
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}

      - name: Export runtime requirements
        run: |
          poetry self add poetry-plugin-export
          poetry export --without-hashes --only main -f requirements.txt -o requirements-audit.txt

      - name: pip-audit
        run: |
          python -m pip install pip-audit
          pip-audit --requirement requirements-audit.txt

  # ---------------------------------------------------------------------
  # Real hardware validation. Needs a self-hosted runner with a TFLite
  # runtime and a model on disk, so it never runs on pull requests.
  # See docs/CI_READINESS.md.
  # ---------------------------------------------------------------------
  hardware:
    name: Hardware benchmark smoke
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, edge-bench-hardware]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: make install

      - name: Install TFLite runtime for this host
        run: make install-hardware

      - name: Hardware tests
        run: make test-hardware

      - name: Benchmark smoke run
        run: make benchmark-smoke

      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-smoke-results
          path: results/smoke/
          if-no-files-found: warn
