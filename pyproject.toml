[project]
name = "edge-bench"
version = "0.1.0"
description = "Remote ML benchmarking system for Raspberry Pi + Google Coral Edge TPU"
authors = [
    {name = "edge-bench contributors"}
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi (>=0.135.3,<0.136.0)",
    "uvicorn[standard] (>=0.44.0,<0.45.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "python-multipart (>=0.0.31,<0.1.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "aiofiles (>=25.1.0,<26.0.0)",
    "websockets (>=16.0,<17.0)",
    "apscheduler (>=3.10,<4.0)",
    "psutil (>=7.2.2,<8.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[dependency-groups]
dev = [
    "ruff (>=0.14.14,<0.15.0)",
    "pre-commit (>=4.5.1,<5.0.0)",
    "pytest",
    "pytest-cov",
    "mypy (>=1.14,<2.0)",
    "numpy (>=1.24)"
]
# The TFLite runtime is intentionally NOT a locked dependency: the correct
# package differs per platform (tflite-runtime on ARM, ai-edge-litert on
# x86_64, tensorflow as a fallback) and CI never needs any of them.
# `make install-hardware` installs the right one for the current host.

# =============================================================
# Ruff — single source of truth
# =============================================================

[tool.ruff]
line-length = 88
target-version = "py312"
fix = true

# -------------------------------------------------------------
# Lint rules
# -------------------------------------------------------------
[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "B",
  "C4",
  "UP",
  "I",
  "C90",
]

ignore = [
  "E501",
  "B008",
  "B904",
  "Q000", # conflicts with ruff-format
  "Q003", # conflicts with ruff-format
  "B905",
]

[tool.ruff.lint.mccabe]
max-complexity = 25

# -------------------------------------------------------------
# Import sorting (ex-isort)
# -------------------------------------------------------------
[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true

# -------------------------------------------------------------
# Formatter (ex-Black)
# -------------------------------------------------------------
[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

# -------------------------------------------------------------
# Per-file ignores
# -------------------------------------------------------------
[tool.ruff.lint.per-file-ignores]
# conftest.py must insert to sys.path before importing server package
"tests/conftest.py" = ["E402"]

# =============================================================
# pytest
# =============================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
# Default run is CPU-only and hardware-free: `pytest` must stay green on any
# CI runner. Hardware tests opt in with `pytest -m hardware`.
addopts = "-m 'not hardware'"
markers = [
    "hardware: requires a real TFLite runtime and a model file on disk (not run in CI)",
]

[tool.coverage.run]
source = ["server", "agent"]
omit = ["*/__pycache__/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# =============================================================
# mypy
# =============================================================

[tool.mypy]
python_version = "3.12"
files = ["server"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
# The server is untyped-by-default legacy FastAPI code; this configuration
# checks what is annotated without demanding a full typing retrofit.
check_untyped_defs = false
disallow_untyped_defs = false

# Note: `agent/` is intentionally outside `files`. It is deployed flat on the
# Raspberry Pi and uses top-level imports (`from metrics import ...`), which
# mypy cannot resolve from the repo root.

[tool.poetry]
package-mode = false
